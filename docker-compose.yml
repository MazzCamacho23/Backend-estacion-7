# Entorno local completo: PostgreSQL + API
#   docker compose up -d db        -> solo la base de datos (para `npm run dev`)
#   docker compose up -d --build   -> todo
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estacion_siete
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estacion_siete"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/estacion_siete?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@db:5432/estacion_siete?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
